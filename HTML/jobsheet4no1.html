<!DOCTYPE html>
<html>
<head>
    <title>Form Login</title>
</head>
<body>
    <p>
    <form action="formtext.html">
    <fieldset>

        <legend>Form login</legend>
        <label for="Username">Username :</label>
        <input type="text" name="username" id="username" maxlength="25" />
    </p>
    <p>
        <label for="pass">Password :</label>
        <input type="password" name="pass" id="pass" maxlength="8" />
    </p>
    <p>
        <input type="submit" name="btn" id="button" value="Submit" />
        <input type="reset" name="btn" id="button" value="Reset" />
    </p>
    </fieldset>
    </form>
</body>
</html>
