<!DOCTYPE html>
<html>
        <!-- cellpadding,rowspan,cellspacing,colspan -->
<head>
    <title>Tabel</title>
</head>
<body>
    <table align="center" border="1" cellpadding="8" cellspacing="0" width="60%"> 
     <h1 align="center">Tabel Harga Buah</h1>
    <caption><b>Stok Toko Buah</b></caption>
         <tr bgcolor="palegreen">
      <th rowspan="2">Nama Buah</th>
      <th colspan="2">Detail</th>
  </tr>
  <tr bgcolor="palegreen">
      <th>Stok</th>
      <th>Harga (Rp)</th>
  </tr>
  
  <tr bgcolor="lightblue">
      <td>Apel</td>
      <td align="center">10kg</td>
      <td align="right">30.000</td>
  </tr>
<tr bgcolor="lightblue">
    <td>Jeruk</td>
    <td align="center">15kg</td>
    <td align="right">25.000</td>
</tr>

<tr bgcolor="lightyellow">
 <th colspan="2" align="right">Total Jenis Buah:</th>
 <td align="center">2 Jenis</td>
</tr>
</table>
  
  
  
  
</body>
</html>
