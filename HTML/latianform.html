<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Kursus</title>
</head>
<body>

    <fieldset>
        <legend><b>Form Pendaftaran Kursus</b></legend>
        
        <form action="" method="post">
            <table border="1" cellpadding="3" cellspacing="0">
                <tr>
                    <td>Nama</td>
                    <td>:</td>
                    <td><input type="text" name="nama"></td>
                </tr>
                <tr>
                    <td rowspan="2">Jenis Kelamin</td>
                    <td rowspan="2">:</td>
                    <td><input type="radio" name="jk" value="Wanita"> Wanita</td>
                </tr>
                <tr>
                    <td><input type="radio" name="jk" value="Pria"> Pria</td>
                </tr>
                <tr>
                    <td>Kursus yang akan diikuti</td>
                    <td>:</td>
                    <td>
                        <select name="kursus">
                            <option value="Design Grafis">Design Grafis</option>
                            <option value="Web Programming">Web Programming</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td rowspan="5">Pilihan Hari</td>
                    <td rowspan="5">:</td>
                    <td><input type="checkbox" name="hari[]" value="Senin"> Senin</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="hari[]" value="Selasa"> Selasa</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="hari[]" value="Rabu"> Rabu</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="hari[]" value="Kamis"> Kamis</td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="hari[]" value="Jumat"> Jumat</td>
                </tr>
                <tr>
                    <td>Alamat</td>
                    <td>:</td>
                    <td><textarea name="alamat" id="" rows="5"></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td>
                        <input type="submit" value="submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>

</body>
</html>
