<!DOCTYPE html>
<html>
    <!--cellpadding,rowspan,cellspacing,colspan-->
<head>
    <title>Belajar Tabel</title>
</head>
<body>
    <h1>Praktik Tabel HTML</h1>
    <table border="2" cellpadding="8" cellspacing="3" width="80%">
        <tr bgcolor="yellow">
            <th colspan="2">Jadwal Mata Pelajaran</th>
        </tr>

        <tr>
            <th>Hari</th>
            <th>Mata Pelajaran</th>
        </tr>

        <tr align="center">
            <td>Senin</td>
            <td>Matematika</td>
        </tr>
        <tr align="center">
            <td>Selasa</td>
            <td>Seni Budaya</td>
        </tr>
        <tr align="center">
            <td>Rabu</td>
            <td>Olahraga</td>
        </tr>
        <tr align="center">
            <td>Kamis</td>
            <td>Bahasa Jawa</td>
        </tr>
        <tr align="center">
            <td>Jumat</td>
            <td>Bahasa Indonesia</td>
        </tr>
    </table>
</body>
</html>
